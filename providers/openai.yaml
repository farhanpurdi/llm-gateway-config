provider: openai

display_name: OpenAI

enabled: true

credential:
  type: environment
  environment_variable: OPENAI_API_KEY

logical_models:

  - logical_name: company-fast
    provider_model: gpt-5.6-terra
    enabled: true

  - logical_name: company-coding
    provider_model: gpt-5.6-sol
    enabled: true

notes:
  - Provider credentials must never be committed to Git.
  - Developers must use logical model names instead of provider model names.